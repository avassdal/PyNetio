[project]
name = "Netio"
version = "1.0.13"
description = "Interface to control NETIO Products devices"
authors = [{name = "Adam Verner", email = "averner@netio.eu"}]
readme = "README.md"
license = {text = "MIT"}
keywords = ["netio", "netio products", "power control", "power management", "power monitoring", "power metering",
    "power switching", "power switching device", "power switching devices", "power switching products",
    "power switching products"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Power (UPS)",
    "Topic :: Utilities",
]
requires-python = ">=3.8,!=3.9.0,!=3.9.1"
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "cryptography>=45.0.3,<46.0.0",
    "pyopenssl>=25.1.0,<27.0.0",
]

[project.urls]
Repository = "https://github.com/netioproducts/PyNetio"

[project.scripts]
Netio = "Netio.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.4.2,<9.0.0",
    "requests-mock>=1.12.1,<2.0.0",
    "setuptools>=68.2.2,<81.0.0",
]

[tool.poetry]
packages = [{include = "Netio"}]


[build-system]
requires = ["poetry-core>=2.1.0"]
build-backend = "poetry.core.masonry.api"

